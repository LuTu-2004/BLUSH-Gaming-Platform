name: blush_mobile_app
description: "BLUSH AI Gaming Platform - Flutter Mobile Application (EXE201)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client cho REST API (.NET Backend)
  http: ^1.2.0

  # State Management
  provider: ^6.1.1

  # Bộ nhớ lưu JWT Token
  shared_preferences: ^2.2.2

  # UI Design & Styling
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  flutter_spinkit: ^5.2.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  signalr_netcore: ^1.4.4
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
